<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QEC / Replay</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header>
      <h1>QEC <span>/ Replay</span></h1>
    </header>
    <main>
      <section
        id="circuit-editor"
        class="workflow-step"
        aria-labelledby="circuit-title"
      >
        <h2 id="circuit-title">Circuit</h2>
        <label class="template"
          >Circuit
          <select id="circuit-template">
            <option value="surface_code:rotated_memory_z">
              Surface memory · d3 Z · 3 rounds
            </option>
            <option value="custom">Custom Clifford circuit</option>
          </select>
        </label>

        <details id="advanced">
          <summary>Advanced</summary>
          <label
            >Annotated Stim circuit<textarea
              id="circuit-text"
              rows="6"
              spellcheck="false"
            ></textarea>
          </label>
          <label
            >Reference Stim (optional)<textarea
              id="reference-text"
              rows="4"
              spellcheck="false"
              placeholder="Leave blank for the circuit's noiseless reference"
            ></textarea>
          </label>
          <label
            >Logical circuit (optional, as supplied)<textarea
              id="logical-text"
              rows="3"
              spellcheck="false"
              placeholder="Optional Clifford gates, for example H 0. Mapping is not verified."
            ></textarea>
          </label>
        </details>
      </section>
      <details
        id="configure"
        class="workflow-step"
        aria-labelledby="configure-title"
      >
        <summary id="configure-title">Configure</summary>

        <div class="settings">
          <label
            >Added gate depolarization
            <input
              id="added-noise"
              type="number"
              min="0"
              max="0.75"
              step="0.001"
              value="0"
              required
            />
          </label>
          <label
            >Seed
            <input
              id="seed"
              type="number"
              min="0"
              step="1"
              value="20261107"
              required
          /></label>
          <label
            >After Clifford depolarization
            <input
              id="after_clifford_depolarization"
              type="number"
              min="0"
              max="0.75"
              step="0.001"
              value="0.001"
              required
          /></label>
          <label
            >Before round data depolarization
            <input
              id="before_round_data_depolarization"
              type="number"
              min="0"
              max="0.75"
              step="0.001"
              value="0.001"
              required
          /></label>
          <label
            >Before measure flip
            <input
              id="before_measure_flip_probability"
              type="number"
              min="0"
              max="0.75"
              step="0.001"
              value="0.001"
              required
          /></label>
          <label
            >After reset flip
            <input
              id="after_reset_flip_probability"
              type="number"
              min="0"
              max="0.75"
              step="0.001"
              value="0.001"
              required
          /></label>
        </div>
      </details>

      <div id="status" role="status" aria-live="polite">Loading…</div>
      <div class="workspace">
        <section class="physical" aria-label="Circuit replay">
          <div class="section-head">
            <h2 id="tick-label">Tick 0</h2>
            <span id="operations">R</span>
          </div>
          <p id="grid-note">Surface-memory physical qubits</p>
          <div id="physical-scroll">
            <div id="lattice" aria-label="All physical qubits"></div>
          </div>
          <div class="toolbar">
            <fieldset>
              <legend>Inject</legend>
              <button data-pauli="X" aria-pressed="true">X</button
              ><button data-pauli="Y" aria-pressed="false">Y</button
              ><button data-pauli="Z" aria-pressed="false">Z</button>
            </fieldset>
            <label
              >Fault tick
              <input id="fault-tick" type="number" min="0" max="21" value="0"
            /></label>

            <button id="reset" disabled>Clear faults</button>
            <ul id="scenario" aria-label="Injected faults"></ul>
          </div>
          <div class="legend">
            <span class="x-key">X stabilizer</span
            ><span class="z-key">Z stabilizer</span>
            <span class="gate-key">Active gate</span
            ><span class="error-key">Error</span
            ><span class="detector-key">Detector flip</span
            ><span class="fix-key">Host correction</span>
          </div>
        </section>
        <section
          class="analysis-panels"
          aria-label="Circuit and detector timeline"
        >
          <section id="circuit-view" aria-label="Logical or input circuit">
            <div class="section-head">
              <h2 id="diagram-title">Logical circuit</h2>
            </div>
            <p id="diagram-note" hidden></p>
            <div id="diagram-scroll"><div id="circuit-diagram"></div></div>
          </section>

          <section id="decoder-view">
            <div class="section-head">
              <h2>Decoder bit</h2>
              <span id="event-count">0</span>
            </div>
            <p id="boundary-note" hidden></p>
            <div id="timeline-scroll">
              <div
                id="timeline"
                aria-label="Detector bits by measurement boundary"
              ></div>
            </div>
            <div id="result" aria-live="polite"></div>
          </section>
        </section>
      </div>
      <details id="evidence">
        <summary>Details</summary>
        <output id="run-summary" aria-live="polite"></output>
      </details>
    </main>
    <footer id="control-dock" aria-label="Simulation and replay controls">
      <div class="dock-inner">
        <section class="run-step" aria-labelledby="run-title">
          <h2 id="run-title" class="visually-hidden">Simulate and decode</h2>
          <button id="run" disabled>Simulate and decode</button>
        </section>
        <div class="replay">
          <h2 class="visually-hidden">Replay</h2>
          <div class="transport">
            <button id="back" aria-label="Previous tick" disabled>←</button>
            <button id="play" aria-label="Play" title="Play" disabled>▶</button>
            <button id="step" aria-label="Next tick" disabled>→</button>
            <label
              >Speed
              <select id="speed">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select>
            </label>
            <output id="position">0 / 22</output>
          </div>
          <input
            id="scrubber"
            type="range"
            min="0"
            max="22"
            value="0"
            step="1"
            aria-label="Circuit tick"
            disabled
          />
        </div>
      </div>
    </footer>
    <noscript>JavaScript required.</noscript>
  </body>
</html>
